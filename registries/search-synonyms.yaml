# registries/search-synonyms.yaml — the hand-written half of the search synonym table
# (keyword-search proposal, fix 3, docs/proposals/keyword-search-five-fixes.md).
#
# `merge` writes index.db `search_synonyms` (read contract v_search_synonyms) from this file plus
# data the producer already holds: the documents' application names, codes, namespaces and
# products, the package master registry (inventory/package-master.yaml), and the SKL's file names
# (file 200 → NEW PERSON). Every search front door expands an unquoted word or phrase that is a
# term into its alternatives (rules and cases: contracts/query/v1.json, `synonyms`).
#
# packages      application code → the plain-English names a non-technical searcher types. Each
#               name expands to that application's name, code and namespaces. A name must name a
#               package, not a concept every package's manuals use ("security keys", "sign on",
#               "menus" and "data dictionary" were dropped for that: they pushed other packages'
#               answers down). Reviewer drafts approved by the operator unchanged 2026-11-06
#               (Appendix B), one entry per application in the latest corpus.
# kernel_parts  Kernel parts people name on their own, with their own alternatives.
# terms         other hand-written terms (routines, files, concepts). Each goes in only together
#               with the judged golden query it fixes (`fixes:`, an id in golden-queries.yaml).
#               match_case: 1 when the term matches only as written (a code); default 0.

