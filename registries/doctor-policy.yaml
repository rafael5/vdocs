# registries/doctor-policy.yaml
# =========================================================================================
# Policy for `vdocs doctor` — the shipped GOLD LIBRARY: GREEN|RED soundness gate.
#
# It encodes what separates a BY-DESIGN gap (expected-empty, not a defect) from a real FAIL,
# so the operator never mistakes a known/by-design shortfall for corruption (F6), and a real
# regression is never hidden behind a lenient threshold.
#
#   coverage.<field>.min_pct   — the FAIL floor: gold coverage below this is a defect (RED).
#   coverage.<field>.by_design — if set, a below-100% (but >= min_pct) result is reported as
#                                BY-DESIGN with this explanation, not a failure.
#
# Tighten a floor to 100 to demand full coverage; add a by_design note to bless a known gap.
# =========================================================================================

coverage:
  # the persona bake + identity — 100% expected on every gold (is_latest) document …
  app_user:          {min_pct: 100}
  doc_user:          {min_pct: 100}
  software_class:    {min_pct: 100}
  doc_type:          {min_pct: 100}   # an empty doc_type breaks anchoring/faceting → triage it
  # … except function_category: the fallback-profile apps carry no Monograph SPM line, so a small
  # gap here is BY-DESIGN, not corruption (2026-06-10 run: 94.3%; 0/104 main profiles affected).
  function_category: {min_pct: 90, by_design: "fallback-profile apps have no Monograph SPM line"}

# Gold documents whose anchor_key is not the canonical 4-part form (app:pkg:type:stem) but are
# accepted as known/documented edge cases — listed by doc_id so `doctor` WARNs on *new* anchor
# corruption while staying quiet about these.
accepted_anchor_edge_cases:
  - "AR/WS:p13"   # PSGW*2.3*13 "…User Manual Change Pages" — bare patch-token slug, no version stem

# Version groups accepted as anchorless (known upstream grouping drift — the latest lives
# under a sibling anchor_key spelling). Each entry stays visible as WARN, never silent PASS.
# accepted_anchorless_groups:
#   - "APP:PKG:DT:slug"

# Body coverage (end-to-end review A2, decision D2): the share of each latest document's body word
# tokens (gold body.md with the frontmatter, normalize's identity header and the generated
# `## Contents` list dropped) that its non-table chunks hold. Below `min_pct` is RED unless the document is listed here WITH a reason; the list is
# printed on every `vdocs doctor` run, an exception naming a document that is not a latest document
# is RED (a vanished document must not keep an exception alive), and one the document no longer
# needs is a WARN to remove. D2: 95 now, 99 once the three known causes are fixed.
body_coverage:
  min_pct: 95
  # Three documents whose converter turned whole paragraphs into headings with nothing under them
  # (LR 48 such sections, EDIS 18, PXRM 14). A heading with no body is not on the search surface
  # (kernel.markdown.is_searchable), so the sentence IS the lost text. Measured 2026-11-07
  # (reports/a2-after.md); 130 such sections in 31 latest documents corpus-wide. Expiry: a
  # "sentence heading carries its own text" chunking rule (end-to-end review, follow-up to A2) —
  # when it lands these three rise above the floor and doctor WARNs that the entries are stale.
  exceptions:
    LR/labbbumf: paragraphs converted as headings with no body (48 sections); their text is the heading, which a bodiless section does not index
    EDIS/edp_2_1_1_ug: paragraphs converted as headings with no body (18 NOTE sections); same cause
    PXRM/ahobpr_registrantportal_usermanual_v3: paragraphs converted as headings with no body (14 sections); same cause
