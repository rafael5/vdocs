      - { section_id: DI/fm22_2dg/exportddxp-data-export, grade: 1 }
      - { section_id: DI/fm22_2um2/sending-export-data-to-a-host-file, grade: 1 }
    notes: >
      The audit's cited class ([S10]): the API contract — Reference Type, Supported, Category,
      ICR# 2648, Description — lives in the container's own lead-in, above its first child
      heading, so it was never chunked. The two grade-1s are the opposite direction (export),
      genuinely related but not the answer. A CPRS "quick order auditing" section is a lexical
      near-miss on "host file … import" and is deliberately unlabelled.

