  # ── P6.4 (2026-08-02): the SHORT-REFERENCE / API-LEAD-IN class ─────────────────────────────────
  # Why these exist: P6.1b made 8,447 previously chunk-less sections searchable, and this set did
  # not move by a single ranked hit — it had no query for the class. A metric that cannot see a
  # change can neither credit nor regress on it, so the "no regression" it reported was a statement
  # about its own coverage, not about the change. Every `grade: 3` below is a section that carried
  # ZERO chunks before P6.1b (`kind` container or hollow) — i.e. these queries scored 0 and were
  # unanswerable at the time they were written. Graded by READING the sections, not by running the
  # engine; the lexical near-misses are deliberately left unlabelled as discriminators.
  - id: fileman-import-host-file
    query: How do I import data from a host file into a VA FileMan file?
    intent: The FILE^DDMP API — the supported way to load ASCII host-file data into FileMan.
    axis: api-leadin
    relevant:
