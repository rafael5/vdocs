# registries/inventory/scope-changes.yaml
# =========================================================================================
# CURATED acknowledgements of admitted-set departures (CI.4, audit R‑19).
#
# The fetch stage records the admitted set each run (the lake's
# inventory/gold/admitted-baseline.json) and compares by document identifier, grouped by
# application. An application leaving the admitted set — a VA relabel, a policy edit, an
# enrichment regression — FAILS the run unless it is acknowledged here. Acknowledging is
# deliberately cheap: one entry, and the alarm stands down while the departure stays
# reported. An alarm nobody can silence quietly becomes an alarm nobody keeps.
#
# NOTE the CI.2 master-set rule: a departure never removes documents already fetched — they
# are retained in the collection with their lifecycle labels (CI.3). This file only records
# that the SCOPE change was seen and meant.
#
# Entry shape:
#   - app_code: XOBW            # the application whose departure is acknowledged
#     date: 2026-08-03          # when it was acknowledged
#     reason: ruled out of scope (integration middleware, not VistA M)
# =========================================================================================

changes:
  - app_code: ADT
    date: 2026-11-05
    reason: >-
      VA re-filed the 14 ISS release user guides from ADT (appid 55) to Scheduling (SD, appid 399,
      archive); they re-enter the admitted set under SD ids. A re-file, not a removal.
  - app_code: PRF
    date: 2026-11-05
    reason: >-
      patient_record_flags_user_guide is still listed under PRF, but VA added a same-named file under
      ADT ("PIMS Version 5.3 User Guide") and fetch keeps one target per doc_slug, so the ADT copy
      now shadows the PRF one. A selection artefact, not an upstream removal.
  - app_code: PSO
    date: 2026-11-05
    reason: >-
      pso_7_tech_um moved to an archive app (appid 394) with only the PDF listed; no DOCX remains on
      the VDL, so it no longer passes the DOCX-only rule.
  - app_code: PSS
    date: 2026-11-05
    reason: pss_1_dosing_ord_ck_um_r0918 is no longer listed anywhere on the VDL (2026-11-05 crawl).
