# registries/inventory/namespace-names.yaml
# =========================================================================================
# Full names for the inventory's package namespaces (pkg_ns), published as v_vocab rows of
# kind `namespace` and read by the Inventory mode only — the Library keeps its current names
# until its own rename change (inventory browser proposal, decision D4).
#
# `package_file` is a VERBATIM copy of the PACKAGE file (#9.4) names in vista-meta's measured
# export — capitals included; their casing is decided with the Library renames, not here:
#   repo     ~/projects/vista-meta, commit d0df56bfdff7fb9d7fb2388f71876827c12c81eb (data-v1-48)
#   file     vista/export/code-model/package-namespace.tsv, columns namespace → package_name
#   sha256   40d561c29ea576c66ccd65a5e32e9e6646dc75a286701d172c8e0381a9735f17
#            (the file last changed in vista-meta f1e9d332aaaa4185c0eb74b9feb1f37a9d552229)
# Re-derive the section (it was generated by exactly this; a diff against it shows any edit
# or upstream drift):
#   git -C ~/projects/vista-meta show d0df56b:vista/export/code-model/package-namespace.tsv \
#     | awk -F'\t' 'NR>1 && $3!="" {printf "  \"%s\": \"%s\"\n", $3, $2}' | LC_ALL=C sort
#
# `overrides` are applied after the copy, so a re-copy keeps them. The four names were chosen
# by the operator on 2026-11-05 (proposal §3).
#
# A namespace in neither section takes the same-code application's name from the inventory,
# and its vocab row says so; a namespace with no same-code application has no row.
# =========================================================================================

